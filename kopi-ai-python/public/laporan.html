<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Penjualan - Kopi Sudut</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  .page { padding: 18px 20px 40px; max-width: 1000px; margin: 0 auto; }
  .tanggal { margin: 0 0 16px; color: var(--muted); }
  .angka { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .angka div { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; }
  .angka strong { display: block; font-family: var(--serif); font-size: 28px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .panel h2 { font-size: 20px; margin-bottom: 12px; }
  .rank { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .rank .nama { width: 150px; flex-shrink: 0; }
  .rank .batang { flex: 1; background: var(--bg); border-radius: 6px; height: 18px; overflow: hidden; }
  .rank .batang i { display: block; height: 100%; background: var(--green); border-radius: 6px; }
  .rank b { width: 36px; text-align: right; }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 180px; padding-top: 10px; overflow-x: auto; }
  .chart .col { flex: 1; min-width: 18px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .chart .bar { width: 100%; background: var(--crema); border-radius: 4px 4px 0 0; min-height: 2px; }
  .chart .bar.nol { background: var(--line); }
  .chart small { font-size: 11px; color: var(--muted); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 15px; }
  th { font-weight: 600; color: var(--muted); }
  td.r, th.r { text-align: right; }
  .tabel-scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Kopi Sudut · Laporan</h1>
  <a href="/barista">Antrean</a>
  <a href="/menu">Kelola menu</a>
  <a href="/laporan" class="aktif">Laporan</a>
  <a href="/meja">QR meja</a>
</div>
<div class="page">
  <p class="tanggal" id="tanggal"></p>
  <div class="angka">
    <div><span class="muted">Total penjualan hari ini</span><strong class="rp" id="total">-</strong></div>
    <div><span class="muted">Jumlah pesanan</span><strong id="jumlah">-</strong></div>
    <div><span class="muted">Rata-rata per pesanan</span><strong class="rp" id="rata">-</strong></div>
  </div>
  <div class="grid2">
    <section class="panel"><h2>5 menu terlaris</h2><div id="top5"></div></section>
    <section class="panel"><h2>Penjualan per jam (Rp ribu)</h2><div class="chart" id="chart" role="img" aria-label="Grafik penjualan per jam"></div></section>
  </div>
  <section class="panel">
    <h2>Riwayat pesanan hari ini</h2>
    <div class="tabel-scroll"><table>
      <thead><tr><th>Kode</th><th>Jam</th><th>Meja</th><th>Item</th><th>Status</th><th class="r">Total</th></tr></thead>
      <tbody id="riwayat"></tbody>
    </table></div>
  </section>
</div>

<script>
const rp = (n) => 'Rp' + Number(n).toLocaleString('id-ID');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);

async function muat() {
  const d = await (await fetch('/api/laporan')).json();
  $('tanggal').textContent = d.tanggal;
  $('total').textContent = rp(d.totalPenjualan);
  $('jumlah').textContent = d.jumlahPesanan;
  $('rata').textContent = rp(d.rataRata);

  const maks = Math.max(1, ...d.top5.map((t) => t.qty));
  $('top5').innerHTML = d.top5.map((t) => `<div class="rank"><span class="nama">${esc(t.nama)}</span><span class="batang"><i style="width:${(t.qty / maks) * 100}%"></i></span><b>${t.qty}</b></div>`).join('') || '<p class="muted">Belum ada penjualan hari ini.</p>';

  // Tampilkan jam 06 - 23 agar grafik padat
  const jam = d.perJam.map((v, h) => ({ h, v })).filter((x) => x.h >= 6);
  const mk = Math.max(1, ...jam.map((x) => x.v));
  $('chart').innerHTML = jam.map((x) => `<div class="col" title="${String(x.h).padStart(2, '0')}:00 - ${rp(x.v)}"><div class="bar ${x.v ? '' : 'nol'}" style="height:${(x.v / mk) * 85}%"></div><small>${x.h}</small></div>`).join('');

  $('riwayat').innerHTML = d.riwayat.map((o) => `<tr>
    <td>${esc(o.kode)}</td>
    <td>${new Date(o.waktu).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</td>
    <td>${esc(o.meja)}</td>
    <td>${o.items.map((i) => `${i.qty}× ${esc(i.nama)}`).join(', ')}</td>
    <td>${esc(o.status)}</td>
    <td class="r rp">${rp(o.total)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Belum ada pesanan hari ini.</td></tr>';
}
muat();
new EventSource('/api/events').addEventListener('update', muat);
setInterval(muat, 30000);
</script>
</body>
</html>
